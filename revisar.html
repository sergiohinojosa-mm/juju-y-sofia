<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar voces</title>
<style>
  :root { --bg: #fff8f0; --ink: #2d2a26; --muted: #7a746b; --card: #fff; --line: #eadfce; --pink: #ff5fa2; --green: #43a047; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1c1a; --ink: #f1ede6; --muted: #a59e93; --card: #2a2825; --line: #4a463f; } }
  :root[data-theme="dark"] { --bg: #1d1c1a; --ink: #f1ede6; --muted: #a59e93; --card: #2a2825; --line: #4a463f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .item { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  button { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--pink); color: #fff; font-size: 22px; cursor: pointer; }
  .meta { font-size: 13px; color: var(--muted); }
  .t { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>🎧 Revisar voces</h1>
  <p class="sub">Toca ▶ y revisa que el audio diga exactamente el texto de al lado. Si alguno no coincide, dime su número.</p>
  <div id="list"></div>
</main>
<script src="audio/frases.js?v=3"></script>
<script>
const items = (window.FRASES || []).filter(f => f.file);
document.getElementById('list').innerHTML = items.length
  ? items.map((f, k) => `<div class="item"><button data-k="${k}" aria-label="Escuchar ${f.id}">▶</button><div><div class="meta">${f.id} · ${f.who}</div><div class="t"></div></div></div>`).join('')
  : '<p class="sub">Todavía no hay grabaciones.</p>';
document.querySelectorAll('.t').forEach((el, k) => { el.textContent = items[k].t; });
let current = null;
document.getElementById('list').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (current) current.pause();
  current = new Audio('audio/' + items[+b.dataset.k].file);
  current.play();
});
</script>
</body>
</html>
