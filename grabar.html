<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grabadora de Luciana</title>
<style>
  :root { --bg: #fff8f0; --ink: #2d2a26; --muted: #7a746b; --card: #fff; --line: #eadfce; --pink: #ff5fa2; --green: #43a047; --red: #e53935; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1c1a; --ink: #f1ede6; --muted: #a59e93; --card: #2a2825; --line: #4a463f; } }
  :root[data-theme="dark"] { --bg: #1d1c1a; --ink: #f1ede6; --muted: #a59e93; --card: #2a2825; --line: #4a463f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .who { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: #e8f5e9; color: #1b5e20; }
  .who.mom { background: #fff3c4; color: #8d5a00; }
  .num { color: var(--muted); font-size: 14px; margin-left: 8px; }
  .phrase { font-size: 32px; font-weight: 700; line-height: 1.3; margin: 16px 0 24px; min-height: 2.6em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 20px; cursor: pointer; color: #fff; background: var(--pink); min-height: 56px; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  button.rec { background: var(--red); }
  button.save { background: var(--green); }
  button:disabled { opacity: .4; cursor: default; }
  .status { margin-top: 14px; color: var(--muted); min-height: 1.5em; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 20px 0 8px; }
  .bar div { height: 100%; background: var(--green); width: 0; }
  details { margin-top: 24px; }
  ol { padding-left: 24px; }
  li.done { color: var(--muted); text-decoration: line-through; }
  li { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">🎙️ Grabadora de voces</h1>
  <p class="sub">Lee la frase con voz alegre, como Sofía hablándole a Juju. Graba, escúchala y, si te gusta, guárdala. Cada frase se descarga como un archivo con su número.</p>

  <div class="card">
    <span id="who" class="who">Sofía</span><span id="num" class="num"></span>
    <div id="phrase" class="phrase"></div>
    <div class="row">
      <button id="rec" class="rec">⏺ Grabar</button>
      <button id="play" class="secondary" disabled>▶ Escuchar</button>
      <button id="save" class="save" disabled>💾 Guardar y siguiente</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="prev" class="secondary">← Anterior</button>
      <button id="skip" class="secondary">Saltar →</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="bar"><div id="bar"></div></div>
  <div id="count" class="sub"></div>

  <details>
    <summary>Ver todas las frases</summary>
    <ol id="list"></ol>
  </details>
</main>

<script src="audio/frases.js?v=21"></script>
<script>
// ?quien=luciana muestra solo las frases de Sofía; ?quien=marcela, solo las de las mamás.
const QUIEN = (new URLSearchParams(location.search).get('quien') || '').toLowerCase();
const F = (window.FRASES || []).filter(f => QUIEN === 'luciana' ? f.who === 'Sofía' : QUIEN === 'marcela' ? f.who !== 'Sofía' : true);
const KEY = 'grabadora.hechas';
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const saveDone = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

let i = Math.max(0, F.findIndex(f => !done[f.id]));
let recorder = null, chunks = [], blob = null, stream = null;
const $ = (id) => document.getElementById(id);
// Safari graba en .m4a (se oye en todos lados); Chrome en .webm.
const MIME = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
const EXT = MIME.includes('mp4') ? 'm4a' : 'webm';

function show() {
  const f = F[i];
  if (!f) { $('phrase').textContent = '¡Terminaste todas! Gracias, Luciana. 💖'; $('rec').disabled = true; return; }
  $('who').textContent = f.who;
  $('who').className = 'who' + (f.who === 'Sofía' ? '' : ' mom');
  $('num').textContent = `${f.id} · ${i + 1} de ${F.length}`;
  $('phrase').textContent = f.t;
  $('status').textContent = f.who === 'Sofía' ? '' : 'Esta la dice una mamá animal, con voz de mamá cariñosa.';
  blob = null;
  $('play').disabled = $('save').disabled = true;
  $('rec').disabled = false;
  const n = Object.keys(done).length;
  $('bar').style.width = (100 * n / F.length) + '%';
  $('count').textContent = `${n} de ${F.length} grabadas`;
  $('list').innerHTML = F.map((x, k) => `<li data-k="${k}" class="${done[x.id] ? 'done' : ''}">${x.id} · ${x.t}</li>`).join('');
}

$('rec').onclick = async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    $('status').textContent = 'Esta página no puede usar el micrófono aquí. Ábrela desde la dirección https del juego (GitHub) o desde localhost en la laptop.';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    chunks = [];
    recorder = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
  } catch (e) { $('status').textContent = 'No se pudo usar el micrófono. Revisa el permiso del navegador.'; return; }
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    // Apagar el micrófono al terminar cada frase.
    stream.getTracks().forEach(t => t.stop());
    blob = new Blob(chunks, { type: recorder.mimeType });
    $('rec').textContent = '⏺ Grabar otra vez';
    $('play').disabled = $('save').disabled = false;
    $('status').textContent = 'Escúchala. Si te gusta, guárdala.';
  };
  recorder.start();
  $('rec').textContent = '⏹ Parar';
  $('status').textContent = 'Grabando… lee la frase y luego toca Parar.';
};
$('play').onclick = () => { if (blob) new Audio(URL.createObjectURL(blob)).play(); };
$('save').onclick = () => {
  const f = F[i];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${f.id}.${EXT}`;
  a.click();
  done[f.id] = true; saveDone();
  $('rec').textContent = '⏺ Grabar';
  i++;
  show();
};
$('skip').onclick = () => { i = Math.min(F.length, i + 1); $('rec').textContent = '⏺ Grabar'; show(); };
$('prev').onclick = () => { i = Math.max(0, i - 1); $('rec').textContent = '⏺ Grabar'; show(); };
$('list').onclick = (e) => { const li = e.target.closest('li'); if (li) { i = +li.dataset.k; show(); scrollTo(0, 0); } };
if (QUIEN === 'luciana') $('title').textContent = '🎙️ Grabadora de Luciana (Sofía)';
if (QUIEN === 'marcela') $('title').textContent = '🎙️ Grabadora de Marcela (las mamás)';
show();
</script>
</body>
</html>
