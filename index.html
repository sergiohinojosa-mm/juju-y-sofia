<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fd6ff"/>
      <stop offset="1" stop-color="#e3fbff"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ccbff"/>
      <stop offset="1" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81d4fa"/>
      <stop offset="1" stop-color="#29b6f6"/>
    </linearGradient>
    <clipPath id="portraitClip"><circle r="56"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b3016" flood-opacity=".3"/>
    </filter>
  </defs>
  <g id="scene"></g>
  <g id="hud"></g>
</svg>

<div id="rotate">
  <div class="phone">📱</div>
  <p>¡Gira tu teléfono, Juju!</p>
</div>

<script src="audio/tts.js?v=20"></script>

<script src="js/art2.js?v=20"></script>
<script src="js/levels2.js?v=20"></script>
<script src="js/game.js?v=20"></script>
</body>
</html>
